<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../static/css/aesthetic.css">
	<link rel="stylesheet" href="../static/css/structure.css">
	<link rel="stylesheet" href="../static/css/home.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<title>Bookial - Registrarse</title>
</head>
<body>
	<header>
				<a href="dashboard.html" class="header-div">
			<i class="bi bi-book-half" style="font-size: 48px;"></i>
			<h1>Bookial</h1>
			<p class="header-p">Biblioteca Digital</p>
		</a>
	</header>

	<nav>
		<h3><i class="bi bi-menu-button-wide"></i> Menú</h3>
		<a href="index.html"><i class="bi bi-house"></i> Inicio</a>
		<a href="login.html"><i class="bi bi-box-arrow-in-right"></i> Acceder</a>
		<a href="register.html"><i class="bi bi-person-plus"></i> Registrarse</a>
	</nav>

	<main>
		<div class="auth-container">
			<div class="auth-box">
				<h2><i class="bi bi-person-plus"></i> Registro de Usuario</h2>
				
				<form action="login.html" method="GET">
					<div class="form-group">
						<label for="nombre"><i class="bi bi-person"></i> Nombre:</label>
						<input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
					</div>
					
					<div class="form-group">
						<label for="apellido"><i class="bi bi-person-badge"></i> Apellido:</label>
						<input type="text" id="apellido" name="apellido" required placeholder="Tu apellido">
					</div>
					
					<div class="form-group">
						<label for="rut"><i class="bi bi-card-list"></i> RUT:</label>
						<input type="text" id="rut" name="rut" required placeholder="12.345.678-9">
					</div>
					
					<div class="form-group">
						<label for="email"><i class="bi bi-envelope"></i> Email:</label>
						<input type="email" id="email" name="email" required placeholder="tu@email.com">
					</div>

					<div class="form-group">
						<label for="cargo"> Cargo:</label>
						<select name="cargo" id="cargo">
							<option value="default">Selecciona tu cargo</option>
							<option value="director">Director</option>
							<option value="profesor">Profesor</option>
							<option value="apoderado">Apoderado</option>
							<option value="estudiante">Estudiante</option>
						</select>
					</div>
					
					<div class="form-group">
						<label for="curso"><i class="bi bi-mortarboard"></i> Curso:</label>
						<select id="curso" name="curso">
							<option value="default">Selecciona tu curso</option>
							<option value="1ro básico">1° Básico</option>
							<option value="2do básico">2° Básico</option>
							<option value="3ro básico">3° Básico</option>
							<option value="4to básico">4° Básico</option>
							<option value="5to básico">5° Básico</option>
							<option value="6to básico">6° Básico</option>
							<option value="7mo básico">7° Básico</option>
							<option value="8vo básico">8° Básico</option>
							<option value="1ro básico">1° Medio</option>
							<option value="2do básico">2° Medio</option>
							<option value="3ro básico">3° Medio</option>
							<option value="4to básico">4° Medio</option>
						</select>
					</div>
					
					<div class="form-group">
						<label for="password"><i class="bi bi-lock"></i> Contraseña:</label>
						<input type="password" id="password" name="password" required placeholder="••••••••">
					</div>
					
					<div class="form-group">
						<label for="confirm_password"><i class="bi bi-shield-lock"></i> Confirmar Contraseña:</label>
						<input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••">
					</div>
					
					<button type="submit" class="btn-primary">Registrarse</button>
				</form>
				
				<p class="auth-link">
					¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
				</p>
			</div>
		</div>
	</main>
	<footer>
		<p>&copy; 2026 Bookial - Todos los derechos reservados</p>
		<small>Contacto: bookial@protonmail.com</small>
	</footer>
	<script src="js/nav.js"></script>
	<script src="../static/js/register.js"></script>
	<script src="../static/js/auth.js"></script>
</body>
</html>
