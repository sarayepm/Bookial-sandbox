</head>
<body>
	<header>
		<a href="dashboard.html" class="header-div">
			<i class="bi bi-book-half" style="font-size: 48px;"></i>
			<h1>Bookial</h1>
			<p class="header-p">Biblioteca Digital</p>
		</a>
	</header>

	<nav id="mainNav">
		<h3><i class="bi bi-menu-button-wide"></i> Menú</h3>
		<a href="index.html"><i class="bi bi-house"></i> Inicio</a>
		<a href="../private/dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
		<a href="../private/library.html"><i class="bi bi-book"></i> Biblioteca</a>
		<a href="../private/calendar.html"><i class="bi bi-calendar"></i> Calendario</a>
		<a href="../private/alumnos.html"><i class="bi bi-calendar"></i> Alumnos</a>
		<a href="../private/profesores.html"><i class="bi bi-calendar"></i> Profesores</a>
		<a href="../private/califications.html"><i class="bi bi-calendar"></i> Califications</a>

		<a href="login.html"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
	</nav>

	<main>
		<div class="auth-container">
			<div class="auth-box">
				<h2>Iniciar Sesión</h2>
				<form id="loginForm" method="POST">
					<div class="form-group">
						<label>Email:</label>
						<input type="email" id="email" required>
					</div>
					<div class="form-group">
						<label>Contraseña:</label>
						<input type="password" id="password" required>
					</div>
					<button type="submit" class="btn-primary">Ingresar</button>
				</form>
				<p class="auth-link">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
			</div>
		</div>
		<script src="js/auth.js"></script>
	</main>

	<footer>
		<p>&copy; 2026 Bookial - Todos los derechos reservados</p>
		<small>Contacto: bookial@protonmail.com</small>
	</footer>
	<script src="../../static/js/nav.js"></script>
	<script src="../../static/js/data.js"></script>
</body>
