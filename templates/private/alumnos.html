<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../static/css/aesthetic.css">
	<link rel="stylesheet" href="../../static/css/structure.css">
	<link rel="stylesheet" href="../../static/css/home.css">
	<link rel="stylesheet" href="../../static/css/alumnos.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<title>Bookial - Inicio</title>
</head>
<body>
	<header>
		<a href="dashboard.html" class="header-div">
			<i class="bi bi-book-half" style="font-size: 48px;"></i>
			<h1>Bookial</h1>
			<p class="header-p">Biblioteca Digital</p>
		</a>
	</header>

	<nav id="mainNav">
		<h3><i class="bi bi-menu-button-wide"></i> Menú</h3>
		<a href="index.html"><i class="bi bi-house"></i> Inicio</a>
		<a href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
		<a href="library.html"><i class="bi bi-book"></i> Biblioteca</a>
		<a href="calendar.html"><i class="bi bi-calendar"></i> Calendario</a>
		<a href="alumnos.html"><i class="bi bi-calendar"></i> Alumnos</a>
		<a href="profesores.html"><i class="bi bi-calendar"></i> Profesores</a>
		<a href="califications.html"><i class="bi bi-calendar"></i> Califications</a>
		<a href="gamification.html"><i class="bi bi-calendar"></i> Gamificacion</a>
		<a href="lectionary.html"><i class="bi bi-calendar"></i> Leccionario</a>
		<hr>
		<a href="login.html"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
	</nav>

	<main>
		<h1><i class="bi bi-people"></i> Gestionar Alumnos</h1>
		<button id="btnNuevoAlumno" class="btn-primary">+ Nuevo Alumno</button>
	
		<table id="tablaAlumnos" border="1" style="width:100%; margin-top:20px; border-collapse: collapse;">
			<thead style="background:#f0f0f0;">
				<tr>
					<th>RUT</th>
					<th>Nombre</th>
					<th>Email</th>
					<th>Curso</th>
					<th>Estado</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>
	</main>

	<div id="modalAlumno" class="modal">
		<div class="modal-content">
			<span class="btn-cerrar">&times;</span>
			<h2 id="modalTitulo">Nuevo Alumno</h2>
			<input type="hidden" id="alumnoId">
			<input type="text" id="rut" placeholder="RUT (12345678-5)">
			<input type="text" id="nombre" placeholder="Nombre">
			<input type="text" id="apellidoPaterno" placeholder="Apellido Paterno">
			<input type="text" id="apellidoMaterno" placeholder="Apellido Materno">
			<input type="email" id="email" placeholder="Email">
			<select id="cursoId">
				<option value="">Seleccionar curso</option>
			</select>
			<select id="estado">
				<option value="activo">Activo</option>
				<option value="inactivo">Inactivo</option>
			</select>
			<button id="guardarAlumno" class="btn-primary">Guardar</button>
		</div>
	</div>

	<script src="../../static/js/nav.js"></script>
	<script src="../../static/js/data.js"></script>
	<script src="../../static/js/alumnos.js"></script>

</body>
</html>
