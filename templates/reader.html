<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../static/css/aesthetic.css">
	<link rel="stylesheet" href="../static/css/structure.css">
	<link rel="stylesheet" href="../static/css/home.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<title>Bookial - Leyendo: Don Quijote de la Mancha</title>
	<style>
		.reader-container {
			background: white;
			padding: 30px;
			border-radius: 15px;
			min-height: 60vh;
			box-shadow: 0 5px 20px rgba(0,0,0,0.1);
		}
		.reader-header {
			border-bottom: 2px solid var(--mainorange);
			padding-bottom: 15px;
			margin-bottom: 20px;
		}
		.reader-controls {
			position: sticky;
			top: 0;
			background: var(--lightorange);
			padding: 15px;
			border-radius: 10px;
			margin-bottom: 20px;
			display: flex;
			gap: 15px;
			justify-content: center;
			flex-wrap: wrap;
			z-index: 10;
		}
		.book-content {
			font-size: 1.2rem;
			line-height: 1.8;
			text-align: justify;
			padding: 20px;
			background: #fafafa;
			border-radius: 10px;
			min-height: 500px;
		}
		.btn-reader {
			padding: 8px 20px;
			background: var(--mainpink);
			color: white;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			transition: all 0.3s;
		}
		.btn-reader:hover {
			background: var(--strongorange);
			transform: scale(1.05);
		}
		.progress-saved {
			position: fixed;
			bottom: 20px;
			right: 260px;
			background: #28a745;
			color: white;
			padding: 10px 20px;
			border-radius: 5px;
			display: none;
			z-index: 100;
		}
		@media (max-width: 768px) {
			.progress-saved {
			right: 200px;
		} }
		.page-info {
			background: white;
			padding: 5px 15px;
			border-radius: 5px;
			display: inline-flex;
			align-items: center;
			gap: 10px;
		}
	</style>
</head>
<body>
	<header>
		<div style="display: flex;
		align-items: center; gap: 15px;">
			<i class="bi bi-book-half" style="font-size: 48px;"></i>
			<h1>Bookial</h1>
			<small>Biblioteca Digital</small>
		</div>
	</header>

	<nav>
		<h3><i class="bi bi-menu-button-wide"></i> Menú</h3>
		<a href="index.html"><i class="bi bi-house"></i> Inicio</a>
		<a href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
		<a href="library.html"><i class="bi bi-book"></i> Biblioteca</a>
		<a href="calendar.html"><i class="bi bi-calendar"></i> Calendario</a>
		<hr>
		<a href="login.html"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
	</nav>

	<main>
		<div class="reader-container">
			<div class="reader-header">
				<h1><i class="bi bi-book"></i> Don Quijote de la Mancha</h1>
				<h3>Miguel de Cervantes</h3>
			</div>
			
			<div class="reader-controls">
				<button class="btn-reader" id="prev-page"><i class="bi bi-chevron-left"></i> Anterior</button>
				<span class="page-info">Página <span id="current-page">1</span> de <span id="total-pages">10</span></span>
				<button class="btn-reader" id="next-page">Siguiente <i class="bi bi-chevron-right"></i></button>
				<button class="btn-reader" id="save-progress"><i class="bi bi-save"></i> Guardar</button>
			</div>
			
			<div id="book-content" class="book-content"></div>
			<div id="progress-saved" class="progress-saved"><i class="bi bi-check-circle"></i> Progreso guardado</div>
		</div>

		<script>
			// Capítulos simulados tal como los tenías
			let currentPage = 1;
			let totalPages = 10;
			const chapters = [
				{ title: "Capítulo 1: El Comienzo", content: "Era una noche oscura y tormentosa cuando todo comenzó..." },
				{ title: "Capítulo 2: El Descubrimiento", content: "Entre los estantes polvorientos, encontré un libro que parecía brillar..." },
				{ title: "Capítulo 3: La Aventura", content: "Las páginas pasaban como hojas en otoño..." },
				{ title: "Capítulo 4: El Desafío", content: "Justo cuando creía haber entendido todo, apareció un giro inesperado..." },
				{ title: "Capítulo 5: El Clímax", content: "La historia alcanzó su punto más álgido..." },
				{ title: "Capítulo 6: La Reflexión", content: "Después de la tormenta, llegó la calma..." },
				{ title: "Capítulo 7: El Reencuentro", content: "Los caminos de los personajes se cruzaron nuevamente..." },
				{ title: "Capítulo 8: El Desenlace", content: "Todo tiene un final, y este libro no era la excepción..." },
				{ title: "Epílogo: Un Nuevo Comienzo", content: "Cerré el libro con una sonrisa en el rostro y gratitud..." },
				{ title: "Reflexiones Finales", content: "Este libro me enseñó que la lectura es mucho más que pasar páginas..." }
			];
	
			const currentPageSpan = document.getElementById('current-page');
			const totalPagesSpan = document.getElementById('total-pages');
			const prevBtn = document.getElementById('prev-page');
			const nextBtn = document.getElementById('next-page');
			const saveBtn = document.getElementById('save-progress');
			const bookContent = document.getElementById('book-content');
			const progressSaved = document.getElementById('progress-saved');
	
			function displayPage() {
				currentPageSpan.textContent = currentPage;
				totalPagesSpan.textContent = totalPages;
				const pageContent = chapters[currentPage - 1];
				if (pageContent) {
					bookContent.innerHTML = `
						<div style="padding: 30px;">
							<h2 style="color: var(--mainpink); margin-bottom: 20px;">${pageContent.title}</h2>
							<p style="font-size: 1.1rem; line-height: 1.8;">${pageContent.content}</p>
							<hr style="margin: 30px 0;">
							<div style="display: flex; justify-content: space-between; color: #666; font-size: 0.9rem;">
								<span><i class="bi bi-bookmark"></i> Página ${currentPage} de ${totalPages}</span>
								<span><i class="bi bi-clock"></i> Progreso: ${Math.round((currentPage/totalPages)*100)}%</span>
							</div>
						</div>
					`;
				}
			}
	
			function saveProgress() {
				// Eliminado el FETCH para evitar errores en modo estático local
				progressSaved.style.display = 'block';
				setTimeout(() => { progressSaved.style.display = 'none'; }, 2000);
				console.log('Progreso guardado localmente en página:', currentPage);
			}
	
			function nextPage() { if (currentPage < totalPages) { currentPage++; displayPage(); saveProgress(); } else { alert('¡Completado!'); } }
			function prevPage() { if (currentPage > 1) { currentPage--; displayPage(); saveProgress(); } }
	
			if (nextBtn) nextBtn.addEventListener('click', nextPage);
			if (prevBtn) prevBtn.addEventListener('click', prevPage);
			if (saveBtn) saveBtn.addEventListener('click', saveProgress);
	
			document.addEventListener('keydown', (e) => {
				if (e.key === 'ArrowRight') nextPage();
				if (e.key === 'ArrowLeft') prevPage();
			});
	
			displayPage();
			</script>
		</main>
	
		<footer>
			<p>&copy; 2026 Bookial - Todos los derechos reservados</p>
			<small>Contacto: bookial@protonmail.com</small>
		</footer>
		<script src="js/nav.js"></script>
	</body>
	</html>
