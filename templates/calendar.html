<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../static/css/aesthetic.css">
	<link rel="stylesheet" href="../static/css/structure.css">
	<link rel="stylesheet" href="../static/css/home.css">
	<link rel="stylesheet" href="../static/css/calendar.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet'/>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=person_alert" />
	<title>Bookial - Calendario</title>
</head>
<body>
	<header>
			<a href="dashboard.html" class="header-div">
			<i class="bi bi-book-half" style="font-size: 48px;"></i>
			<h1>Bookial</h1>
			<p class="header-p">Biblioteca Digital</p>
		</a>
	</header>

	<nav>
		<h3><i class="bi bi-menu-button-wide"></i> Menú</h3>
		<a href="index.html"><i class="bi bi-house"></i> Inicio</a>
		<a href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
		<a href="library.html"><i class="bi bi-book"></i> Biblioteca</a>
		<a href="calendar.html"><i class="bi bi-calendar"></i> Calendario</a>
		<hr>
		<a href="login.html"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
	</nav>

	<main>
		<h1><i class="bi bi-calendar"></i> Calendario de Devoluciones</h1>
		<p>Fechas de devolución de tus libros prestados</p>

		<button class="new-event-btn">Nueva Devolucion</button>

		<div id="calendar"></div>

		<dialog id="popup">
			<h2><span class="material-symbols-outlined">person_alert</span>  Pendiente</h2>
			<h3></h3>
		</dialog>

		<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
		<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.js'></script>
		<script>
		document.addEventListener('DOMContentLoaded', function() {
			const calendarEl = document.getElementById('calendar');
			let popup = document.querySelector('#popup');
			let msg = document.querySelector('#popup h3');
			const calendar = new FullCalendar.Calendar(calendarEl, {
				initialView: 'dayGridMonth',
				locale: 'es',
				headerToolbar: {
					left: 'prev,next today',
					center: 'title',
					right: 'dayGridMonth,timeGridWeek,listMonth'
				},
				events: [
					{ title: 'Don Quijote', start: '2026-06-05' },
					{ title: 'Fahrenheit 451', start: '2026-06-12' }
				],
				eventClick: function(info) {
					msg.innerHTML = `Debes devolver <i>${info.event.title}</i>`;
					popup.showModal();
					setTimeout(() => {
						popup.close();
					}, 1000);
				}
			});
			calendar.render();
		});
		</script>
	</main>

	<footer>
		<p>&copy; 2026 Bookial - Todos los derechos reservados</p>
		<small>Contacto: bookial@protonmail.com</small>
	</footer>
	<script src="js/nav.js"></script>
</body>
</html>
