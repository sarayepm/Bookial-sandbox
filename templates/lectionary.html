<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookial - Leccionario</title>
</head>

<body>
    <header>
        <a href="dashboard.html" class="header-div">
            <i class="bi bi-book-half" style="font-size: 48px;"></i>
            <h1>Bookial</h1>
            <p class="header-p">Biblioteca Digital</p>
        </a>
    </header>

    <nav id="mainNav">
        <h3><i class="bi bi-menu-button-wide"></i> Menú</h3>
        <a href="index.html"><i class="bi bi-house"></i> Inicio</a>
        <a href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
        <a href="library.html"><i class="bi bi-book"></i> Biblioteca</a>
        <a href="calendar.html"><i class="bi bi-calendar"></i> Calendario</a>
        <a href="alumnos.html"><i class="bi bi-calendar"></i> Alumnos</a>
        <a href="profesores.html"><i class="bi bi-calendar"></i> Profesores</a>
        <a href="califications.html"><i class="bi bi-calendar"></i> Califications</a>
        <a href="gamification.html"><i class="bi bi-calendar"></i> Gamificacion</a>
        <a href="lectionary.html"><i class="bi bi-calendar"></i> Leccionario</a>
        <hr>
        <a href="login.html"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
    </nav>

    <main>
        <div id="difuminate"></div>
        <div id="popup-curso">
            <h1>SELECCIONE SU CURSO Y ASIGNATURA</h1>
            <div>
                <select name="" id="selec-curso">
                    <option value="">1 ° A</option>
                    <option value="">1 ° B</option>
                    <option value="">1 ° C</option>
                    <option value="">1 ° D</option>
                    <option value="">1 ° E</option>
                    <option value="">1 ° F</option>
                    <option value="">2 ° A</option>
                    <option value="">2 ° B</option>
                    <option value="">2 ° C</option>
                    <option value="">2 ° D</option>
                    <option value="">2 ° E</option>
                    <option value="">2 ° F</option>
                    <option value="">3 ° A</option>
                    <option value="">3 ° B</option>
                    <option value="">3 ° C</option>
                    <option value="">3 ° D</option>
                    <option value="">3 ° E</option>
                    <option value="">3 ° F</option>
                    <option value="">3 ° G</option>
                    <option value="">4 ° A</option>
                    <option value="">4 ° B</option>
                    <option value="">4 ° C</option>
                    <option value="">4 ° D</option>
                    <option value="">4 ° E</option>
                    <option value="">4 ° F</option>
                    <option value="">4 ° G</option>
                </select>
            </div>
            <div>
                <select id="selectAsignaturaPopup">
                    <option value="">Matematica</option>
                    <option value="">Lenguaje</option>
                </select>
            </div>
            <div>
                <button id="btnAceptarPopup">Aceptar</button>
            </div>

            <div id="contenidoLeccionario">
                <h1>Libro de Clases</h1>
                <div class="form-group">
                    <label>Fecha:</label>
                    <input type="date" id="fecha" value="2026-06-10">
                </div>
                <div class="form-group">
                    <label>Contenido Dictado *:</label>
                    <textarea id="contenido" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Objetivo:</label>
                    <textarea id="objetivo" rows="2"></textarea>
                </div>

                <h3>Asistencia</h3>
                <table id="tablaAsistencia">
                    <thead>
                        <tr>
                            <th>Alumno</th>
                            <th>Presente</th>
                            <th>Justificación</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <button id="guardarClase" class="btn-primary btn-guardar">Guardar Clase</button>
            </div>
    </main>
    <script src="../static/js/data.js"></script>
    <script src="../static/js/nav.js"></script>
    <script src="../static/js/lectionary.js"></script>

</body>

</html>
