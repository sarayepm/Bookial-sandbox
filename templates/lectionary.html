<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../static/css/home.css">
	<link rel="stylesheet" href="../static/css/aesthetic.css">
	<link rel="stylesheet" href="../static/css/structure.css">
	<link rel="stylesheet" href="../static/css/lectionary.css">
	<title>Bookial - Leccionario</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
	<nav id="mainNav"></nav>
	<div style="flex:1; display: flex; flex-direction: column;">
		<header>
			<a href="dashboard.html" class="header-div">
				<i class="bi bi-book-half" style="font-size: 36px;"></i>
				<h1>Bookial</h1>
				<p style="font-size: 12px;">Sistema Escolar</p>
			</a>
		</header>
		<main>
			<!-- POPUP -->
			<div id="difuminate"></div>
			<div id="popup-curso">
				<h2>Seleccione Curso y Asignatura</h2>
				<select id="selectCursoPopup">
					<option value="">Cargando cursos...</option>
				</select>
				<select id="selectAsignaturaPopup">
					<option value="">Cargando asignaturas...</option>
				</select>
				<button id="btnAceptarPopup">Aceptar</button>
			</div>

			<!-- CONTENIDO PRINCIPAL (oculto) -->
			<div id="contenidoLeccionario">
				<h1>Libro de Clases</h1>
				<div class="form-group">
					<label>Fecha:</label>
					<input type="date" id="fecha" value="2026-06-10">
				</div>
				<div class="form-group">
					<label>Contenido Dictado *:</label>
					<textarea id="contenido" rows="3" required></textarea>
				</div>
				<div class="form-group">
					<label>Objetivo:</label>
					<textarea id="objetivo" rows="2"></textarea>
				</div>
				<h3>Asistencia</h3>
				<table id="tablaAsistencia">
					<thead>
						<tr>
							<th>Alumno</th>
							<th>Presente</th>
							<th>Justificación</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
				<button id="guardarClase" class="btn-primary">Guardar Clase</button>
			</div>
		</main>
		<footer>
			<p>&copy; 2026 Bookial</p>
		</footer>
	</div>

	<script src="../static/js/data.js"></script>
	<script src="../static/js/lectionary.js"></script>
	<script src="../static/js/nav.js"></script>
</body>

</html>
