<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../static/css/aesthetic.css">
	<link rel="stylesheet" href="../static/css/structure.css">
	<link rel="stylesheet" href="../static/css/home.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
	<title>Bookial - Iniciar Sesión</title>
</head>
<body>
	<header>
		<div style="display: flex; align-items: center; gap: 15px;">
			<i class="bi bi-book-half" style="font-size: 48px;"></i>
			<h1>Bookial</h1>
			<small>Biblioteca Digital</small>
		</div>
	</header>

	<nav>
		<h3><i class="bi bi-menu-button-wide"></i> Menú</h3>
		<a href="index.html"><i class="bi bi-house"></i> Inicio</a>
		<a href="login.html"><i class="bi bi-box-arrow-in-right"></i> Acceder</a>
		<a href="register.html"><i class="bi bi-person-plus"></i> Registrarse</a>
	</nav>

	<main>
		<div class="auth-container">
			<div class="auth-box">
				<h2><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión</h2>
				
				<form action="dashboard.html" method="GET">
					<div class="form-group">
						<label for="email"><i class="bi bi-envelope"></i> Email:</label>
						<input type="email" id="email" name="email" required placeholder="tu@email.com">
					</div>
					
					<div class="form-group">
						<label for="password"><i class="bi bi-lock"></i> Contraseña:</label>
						<input type="password" id="password" name="password" required placeholder="••••••••">
					</div>
					
					<button type="submit" class="btn-primary">Ingresar</button>
				</form>
				
				<p class="auth-link">
					¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
				</p>
			</div>
		</div>
	</main>

	<footer>
		<p>&copy; 2026 Bookial - Todos los derechos reservados</p>
		<small>Contacto: bookial@protonmail.com</small>
	</footer>
	<script src="js/nav.js"></script>
</body>
</html>
